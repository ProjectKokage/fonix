include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - android/**
    - build/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - discarded_futures
    - directives_ordering
    - prefer_final_locals
    - unawaited_futures
