name: FonixDynamicLibraryBindings
description: Dynamic-library bindings for the project-owned Fonix C shim.
output: lib/src/ffi/generated_bindings.dart
preamble: |
  // Regenerate with: dart run ffigen --config ffigen.yaml
headers:
  entry-points:
    - src/dort.h
functions:
  include:
    - dort_.*
structs:
  include:
    - dort_.*
enums:
  include:
    - dort_.*
typedefs:
  include:
    - dort_.*
macros:
  include:
    - DORT_ABI_VERSION
    - DORT_ORT_API_COMPATIBILITY_FLOOR
globals:
  exclude:
    - .*
unions:
  exclude:
    - .*
compiler-opts:
  - -Isrc
  - -Ithird_party/onnxruntime/include
silence-enum-warning: true
