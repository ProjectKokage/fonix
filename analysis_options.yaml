include: package:lints/recommended.yaml

analyzer:
  exclude:
    - templates/android/sherpa_reference_app/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - discarded_futures
    - no_adjacent_strings_in_list
    - only_throw_errors
    - prefer_final_locals
    - throw_in_finally
    - unawaited_futures
